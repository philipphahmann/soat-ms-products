apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: products-app
  namespace: products
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: products-app # Aponta para o nosso Deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # Escala se a CPU média passar de 70%